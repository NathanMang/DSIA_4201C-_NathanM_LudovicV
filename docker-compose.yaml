services:
  mongo:
    image: mongo:latest
    container_name: allocineMongoDB
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  web:
    build: .
    image: dashboard-app
    container_name: dashboard
    depends_on:
      - mongo
    ports:
      - "8050:80"

volumes:
  mongo-data: